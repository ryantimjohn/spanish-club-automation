# Posts the approved Spanish Club for Socialists Instagram posts on schedule.
#
# GitHub's schedule is in UTC and can run a few minutes late, so it runs every hour from
# 8 AM to noon Eastern (both winter and summer time) and post.py decides what is due by
# checking the Eastern time itself. Each post goes out once; post.py keeps a log.

name: Instagram

on:
  schedule:
    - cron: "7 12-17 * * *"   # hourly, about 8 AM - 1 PM Eastern
    - cron: "17 15 * * 0"     # Sundays: check the Instagram key still works (emails if not)
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [test, post-due, post-one, check-key]
        default: test
      item:
        description: "For post-one: the post's id from manifest.json, e.g. 2026-11-13-carousel"
        required: false

permissions:
  contents: write   # save log/posted.json
  issues: write     # comment on the "Instagram log" issue, which emails the owner

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ACTION: ${{ inputs.action }}
          ITEM: ${{ inputs.item }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "17 15 * * 0" ]; then
            python post.py check
          elif [ "$EVENT" = "schedule" ]; then
            python post.py run --live
          else
            case "$ACTION" in
              test)      python post.py run ;;
              post-due)  python post.py run --live ;;
              post-one)  python post.py run --live --item "$ITEM" ;;
              check-key) python post.py check ;;
            esac
          fi
