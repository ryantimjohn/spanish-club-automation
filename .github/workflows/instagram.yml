# Posts the approved Spanish Club for Socialists Instagram posts on schedule, and the Friday
# feed post to the club's Facebook Page.
#
# GitHub's schedule is in UTC and can run late or not at all (on Nov 11-12, 2026 it ran 5-7 hours
# late and skipped most runs), so it is asked to run twice an hour from about 7 AM to 7 PM Eastern,
# and post.py decides what is due by checking the Eastern time itself (a post can go out up to
# 10 hours late, never after the night it lists has started). Each post goes out once; post.py
# keeps a log, so extra runs never double-post.
#
# Facebook is its own step after Instagram, with its own key and log entry. It runs even if the
# Instagram step failed, and it can't change what Instagram does. Nothing goes to Facebook
# before FB_LIVE_FROM in post.py.

name: Instagram

on:
  schedule:
    - cron: "7,37 12-23 * * *"   # twice an hour, about 7 AM - 7 PM Eastern (8 AM - 8 PM in summer)
    - cron: "17 15 * * 0"     # Sundays: check the Instagram key still works (emails if not)
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [test, post-due, post-one, check-key, facebook-post-one, facebook-check-key]
        default: test
      item:
        description: "For post-one or facebook-post-one: the post's id from manifest.json, e.g. 2026-11-13-carousel"
        required: false

permissions:
  contents: write   # save log/posted.json
  issues: write     # comment on the "Instagram log" and "Facebook log" issues, which email the owner

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ACTION: ${{ inputs.action }}
          ITEM: ${{ inputs.item }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "17 15 * * 0" ]; then
            python post.py check
          elif [ "$EVENT" = "schedule" ]; then
            python post.py run --live
          else
            case "$ACTION" in
              test)      python post.py run ;;
              post-due)  python post.py run --live ;;
              post-one)  python post.py run --live --item "$ITEM" ;;
              check-key) python post.py check ;;
              *)         echo "Nothing for Instagram to do." ;;
            esac
          fi

      - name: Facebook
        if: ${{ !cancelled() }}
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ACTION: ${{ inputs.action }}
          ITEM: ${{ inputs.item }}
        run: |
          python -m unittest -q test_post.py
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "17 15 * * 0" ]; then
            python post.py check-facebook --if-live
          elif [ "$EVENT" = "schedule" ]; then
            python post.py facebook --live
          else
            case "$ACTION" in
              test)               python post.py facebook ;;
              post-due)           python post.py facebook --live ;;
              facebook-post-one)  python post.py facebook --live --item "$ITEM" ;;
              facebook-check-key) python post.py check-facebook ;;
              *)                  echo "Nothing for Facebook to do." ;;
            esac
          fi
