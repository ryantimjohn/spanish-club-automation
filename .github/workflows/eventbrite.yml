# Keeps the Spanish Club for Socialists events on Eventbrite in step with Luma: lists each event 5 weeks
# ahead and follows Luma when an event moves or is cancelled. See eventbrite/sync.py.
#
# GitHub's schedule is in UTC and can run late or skip runs (on Nov 11-12, 2026 it did both), so it
# is scheduled every hour at :35 from 14:35 to 23:35 UTC (about 9:35 AM to 6:35 PM Eastern in winter).
# The first scheduled run that succeeds each day (Eastern) syncs; later scheduled runs that day see it
# and do nothing, so the extra runs are only backups.
# Nothing changes on Eventbrite until LIVE_FROM is set in eventbrite/sync.py. Results go to the
# "Eventbrite log" issue, which emails the owner.

name: Eventbrite

on:
  schedule:
    - cron: "35 14-23 * * *"   # hourly, about 9 AM - 6 PM Eastern (10 AM - 7 PM in summer)
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [test, sync-now, check-token]
        default: test

permissions:
  actions: read     # see whether today's sync already ran
  contents: write   # save eventbrite/events.json
  issues: write     # comment on the "Eventbrite log" issue, which emails the owner

concurrency:
  group: eventbrite
  cancel-in-progress: false

jobs:
  eventbrite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip if a scheduled run already synced today
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(python -c "from datetime import datetime, time, timezone; from zoneinfo import ZoneInfo; et = ZoneInfo('America/New_York'); print(datetime.combine(datetime.now(et).date(), time(0), et).astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w "$GITHUB_WORKFLOW" -e schedule -s success --created ">=$since" --json databaseId -q length) || n=0
          echo "Successful scheduled runs since midnight Eastern: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already synced today, so this run does nothing."; fi

      - name: Test the logic
        if: steps.guard.outputs.skip != 'true'
        run: python -m unittest eventbrite/test_sync.py

      - name: Run
        if: steps.guard.outputs.skip != 'true'
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$ACTION" = "sync-now" ]; then
            python eventbrite/sync.py run --live
          elif [ "$ACTION" = "check-token" ]; then
            python eventbrite/sync.py check
          else
            python eventbrite/sync.py run
          fi
