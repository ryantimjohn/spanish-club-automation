# Keeps the Spanish Club for Socialists Meetup group in step with Luma: lists each event 5 weeks
# ahead and follows Luma when an event moves or is cancelled. See meetup/sync.py.
#
# GitHub's schedule is in UTC, so it runs at 14:20 and 15:20 UTC (about 10:20 AM Eastern in summer
# and winter). Nothing changes on Meetup until LIVE_FROM is set in meetup/sync.py. Results go to the
# "Meetup log" issue, which emails the owner.

name: Meetup

on:
  schedule:
    - cron: "20 14,15 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [test, sync-now, check-keys]
        default: test

permissions:
  contents: write   # save meetup/events.json and meetup/venues.json
  issues: write     # comment on the "Meetup log" issue, which emails the owner

concurrency:
  group: meetup
  cancel-in-progress: false

jobs:
  meetup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the logic
        run: python -m unittest meetup/test_sync.py

      - name: Run
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          MEETUP_CLIENT_KEY: ${{ secrets.MEETUP_CLIENT_KEY }}
          MEETUP_SIGNING_KEY_ID: ${{ secrets.MEETUP_SIGNING_KEY_ID }}
          MEETUP_PRIVATE_KEY: ${{ secrets.MEETUP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$ACTION" = "sync-now" ]; then
            python meetup/sync.py run --live
          elif [ "$ACTION" = "check-keys" ]; then
            python meetup/sync.py check
          else
            python meetup/sync.py run
          fi
